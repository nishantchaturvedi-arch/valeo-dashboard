<title>Caregiver Profile · Valeo</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
/* Valeo brand (feelvaleo.com): yellow #FFB900, deep blue #0E3A5E, orange #DD8C45, Poppins, 8px radius */
:root{--yellow:#FFB900;--yellow-light:#FFF0C7;--yellow-mid:#FFD86C;--blue:#0E3A5E;--orange:#DD8C45;--bg:#FFFCF7;--card:#FFFFFF;
  --text:#0E3A5E;--muted:#787664;--border:#EFE9DD;--free:#1F9D55;--free-bg:#E8F6EE;--part:#B7791F;--part-bg:#FFF4D6;--busy:#8A94A6;--busy-bg:#F1F2F5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
header img{height:56px;width:auto;mix-blend-mode:multiply}  /* logo is a JPEG on white: let the cream page show through */
header .tag{font-size:12px;color:var(--muted);text-align:right}
.hero{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(14,58,94,.06)}
.band{height:84px;background:linear-gradient(120deg,var(--yellow) 0%,var(--yellow-mid) 55%,var(--orange) 130%)}
.top{display:flex;gap:20px;padding:0 24px 20px;align-items:flex-end;margin-top:-54px;flex-wrap:wrap}
.photo{width:128px;height:128px;border-radius:50%;border:5px solid #fff;background:var(--yellow-light);object-fit:cover;box-shadow:0 4px 14px rgba(14,58,94,.15);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--blue);flex-shrink:0}
.who{flex:1;min-width:220px;padding-top:58px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700}
.headline{color:var(--muted);font-size:14px;margin:0}
.verified{display:inline-flex;align-items:center;gap:6px;background:var(--yellow-light);color:var(--blue);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 24px 22px}
.fact{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:16px}
.fact span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-top:16px}
h2{font-size:16px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:18px;border-radius:3px;background:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--yellow-light);color:var(--blue);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip.cert{background:#EAF2FB;color:var(--blue)}
.chip.cert:before{content:"✓ ";font-weight:700;color:var(--free)}
p.bio{margin:0;white-space:pre-line}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;border:1px solid transparent}
.day .dw{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.day .dn{font-size:16px;font-weight:700;line-height:1.2}
.day .ds{font-size:10px;font-weight:600;margin-top:2px}
.day.free{background:var(--free-bg);color:var(--free);border-color:#CDEBD9}
.day.part{background:var(--part-bg);color:var(--part);border-color:#F6E2A8}
.day.busy{background:var(--busy-bg);color:var(--busy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.asof{font-size:11px;color:var(--muted);margin-top:6px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:13px 22px;font-size:15px}
.btn.alt{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
footer b{color:var(--orange);letter-spacing:.2em;font-weight:600}
.msg{padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:560px){.top{padding:0 16px 16px}.facts{padding:0 16px 18px}section{padding:16px}.photo{width:108px;height:108px}h1{font-size:22px}.cal{gap:4px}.day{padding:6px 2px}}
.wrap{max-width:860px}
.cvwrap{width:100%;overflow:hidden;margin-top:14px;border-radius:12px;box-shadow:0 6px 24px rgba(14,58,94,.12)}
.cvin{width:816px;transform-origin:0 0}
.cvin .vcv-page{margin-bottom:0}
button.btn{border:0;cursor:pointer;font-family:inherit}
button.btn:disabled{opacity:.6}
@media print{body{background:#fff}.cta,header,footer{display:none}.cvwrap{box-shadow:none;height:auto!important}.cvin{transform:none!important}}
</style>
</head>

var FB = {apiKey:"AIzaSyDL_cSwxL8x90rDVLHaj9fPE1cTcdEEmII",authDomain:"valeo-dashboard.firebaseapp.com",projectId:"valeo-dashboard",storageBucket:"valeo-dashboard.firebasestorage.app",messagingSenderId:"892578266142",appId:"1:892578266142:web:115b3b677c4d53c8c5020f"};
var COUNTRY = {ae:{name:'UAE', site:'https://feelvaleo.com/en-ae/'}, qa:{name:'Qatar', site:'https://feelvaleo.com/'}};
var CITY_PAGE = {DXB:'dubai', AUH:'abu-dhabi', SHJ:'dubai', Alain:'abu-dhabi', RAK:'dubai'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function q(k){ return new URLSearchParams(location.search).get(k) || ''; }
function fit(){
  var w = document.querySelector('.cvwrap'), i = document.querySelector('.cvin'); if(!w || !i) return;
  var s = Math.min(1, w.clientWidth / 816); i.style.transform = 'scale(' + s + ')'; w.style.height = Math.ceil(i.offsetHeight * s) + 'px';
}
function render(p){
  var c = COUNTRY[(p.country||'ae').toLowerCase()] || COUNTRY.ae;
  document.getElementById('ctry').textContent = c.name;
  document.title = (p.name || 'Caregiver') + ' · Valeo caregiver CV';
  var book = c.site + (CITY_PAGE[p.city] ? CITY_PAGE[p.city] + '/babysitting' : (p.country === 'qa' ? '' : 'dubai/babysitting'));
  window._cv = p;
  document.getElementById('root').innerHTML =
    '<div class="cta"><button class="btn" id="dl" onclick="dl()">⬇ Download PDF</button>'
    + '<a class="btn alt" href="' + esc(book) + '" target="_blank" rel="noopener">Book on feelvaleo.com</a>'
    + (p.cv && p.cv.url ? '<a class="btn alt" href="' + esc(p.cv.url) + '" target="_blank" rel="noopener">Original CV</a>' : '') + '</div>'
    + '<div class="cvwrap"><div class="cvin">' + valeoCV.html(p) + '</div></div>';
  valeoCV.fit(document.querySelector('.cvin')); fit(); setTimeout(function(){ valeoCV.fit(document.querySelector('.cvin')); fit(); }, 400); window.addEventListener('resize', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ valeoCV.fit(document.querySelector('.cvin')); fit(); });
}
function dl(){
  var b = document.getElementById('dl'); b.disabled = true; b.textContent = 'Preparing PDF…';
  valeoCV.download(window._cv).then(function(){ b.textContent = '⬇ Download PDF'; b.disabled = false; })
    .catch(function(e){ b.textContent = '⬇ Download PDF'; b.disabled = false; alert('Could not make the PDF: ' + e.message); });
}
(function(){
  if(q('preview')){ try{ var d = JSON.parse(localStorage.getItem('valeo_profile_preview') || 'null'); if(d){ render(d); return; } }catch(e){} }
  var id = q('id'), c = (q('c') || 'ae').toLowerCase();
  if(!id){ document.getElementById('root').innerHTML = '<div class="msg">This profile link is incomplete.</div>'; return; }
  try{
    var app = firebase.initializeApp(FB), db = firebase.firestore(app);
    db.collection('valeo_public_profiles' + (c === 'ae' ? '' : '_' + c)).doc(id).get().then(function(snap){
      if(!snap.exists){ document.getElementById('root').innerHTML = '<div class="msg">This profile is no longer shared.</div>'; return; }
      render(Object.assign({country:c}, snap.data()));
    }).catch(function(e){ document.getElementById('root').innerHTML = '<div class="msg">Could not load this profile. Please try again.</div>'; console.warn(e); });
  }catch(e){ document.getElementById('root').innerHTML = '<div class="msg">Could not load this profile.</div>'; }
})();
</script>
</body>
